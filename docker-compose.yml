services:

  mechanicShop: 
    container_name: mechanicShop-api
    build: 
      context: .
      dockerfile: dockerfile
      target: final
    ports:
      - "5196:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=ep-lingering-pond-ada75ybb-pooler.c-2.us-east-1.aws.neon.tech;Port=5432;Database=neondb;Username=neondb_owner;Password=npg_Q3OtHc1IWVji;SSL Mode=Require;Trust Server Certificate=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      - seq
    networks:
      - mechanicShop-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - mechanicShop-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - mechanicShop-net

  seq:
    image: datalust/seq:latest
    container_name: seq
    volumes:
      - ./containers/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - mechanicShop-net
    ports:
      - "5341:5341"
      - "8081:80"

networks:
  mechanicShop-net:
    driver: bridge