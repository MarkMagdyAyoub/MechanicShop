services:

  mechanicShop: 
    image: mechanicshop-api
    container_name: mechanicShop-api
    build: 
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "5196:80"
      - "7007:443"
    env_file:
      - .env
    depends_on:
      - seq
    networks:
      - mechanicShop-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - mechanicShop-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - mechanicShop-net

  seq:
    image: datalust/seq:latest
    container_name: seq
    volumes:
      - ./containers/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - mechanicShop-net
    ports:
      - "5341:5341"
      - "8081:80"

networks:
  mechanicShop-net:
    driver: bridge